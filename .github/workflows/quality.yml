name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} and independent PDF validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, iconv, mbstring, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - name: Validate the CSS progression registry without claiming a complete level
        run: python tools/check_css_coverage.py --report _build/css-coverage.json
      - run: python -m pip install --require-hashes -r tools/validation-requirements.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - uses: ./.github/actions/setup-qpdf
      - name: Rebuild original example images
        run: python tools/build_images.py --check
      - name: Convert real HTML documents with the native PHP engine
        run: php -d memory_limit=512M examples/generate.php _build/examples
      - name: Validate content, structure, fonts, annotations and all rendered pages
        run: python tools/validate_pdf.py --directory _build/examples
      - name: Convert the unchanged historical W3C CSS1 float document
        run: php -d memory_limit=512M examples/generate-w3c.php _build/examples/w3c
      - name: Verify W3C PDF text, float geometry, borders and canvas independently
        run: python tools/validate_w3c_css1.py --pdf _build/examples/w3c/test5526c.pdf --manifest _build/examples/w3c/manifest.json --output _build/examples/w3c/validation
      - name: Convert the CSS1 spacing, Unicode and first-line indentation witness
        run: php -d memory_limit=512M examples/generate-text-spacing.php _build/examples/text-spacing
      - name: Reject corrupt text maps with independent mutation witnesses
        run: python tests/test_pdf_text_oracle.py --pdf _build/examples/invoice.pdf --report _build/examples/text-oracle-regressions.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-pdf-evidence-php-${{ matrix.php }}
          path: _build/examples
          if-no-files-found: error

  browser-witnesses:
    name: Computed styles and box geometry in Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, iconv, mbstring, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --prefix tools --ignore-scripts
      - run: npm audit --prefix tools
      - run: npx --prefix tools playwright install --with-deps chromium firefox
      - run: php tests/export-style-witnesses.php _build/styles
      - run: node tools/test_css_foundation_oracle.cjs _build/styles/styles.json
      - run: node tools/validate_styles.cjs _build/styles/styles.json _build/styles/browsers
      - run: node tools/test_w3c_css1_oracle.cjs
      - run: node tools/validate_w3c_css1.cjs _build/styles/w3c
      - name: Reject deliberately wrong text-spacing and indentation observations
        run: node tools/test_text_spacing_oracle.cjs
      - name: Observe CSS1 glyph spacing and first-line indentation in both browsers
        run: node tools/validate_text_spacing.cjs _build/styles/text-spacing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-style-witnesses
          path: _build/styles
          if-no-files-found: error

  text-spacing-pdf:
    name: CSS1 text geometry from PHP ${{ matrix.php }} against both browsers
    needs: [php, browser-witnesses]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r tools/validation-requirements.txt
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - uses: ./.github/actions/setup-qpdf
      - uses: actions/download-artifact@v8
        with:
          name: native-pdf-evidence-php-${{ matrix.php }}
          path: _build/examples
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: browser-style-witnesses
          path: _build/styles
          digest-mismatch: error
      - name: Verify emitted glyph positions, Unicode, link extent and page continuation
        run: >-
          python tools/validate_text_spacing.py
          --pdf _build/examples/text-spacing/text-spacing.pdf
          --manifest _build/examples/text-spacing/manifest.json
          --browser-report _build/styles/text-spacing/browser-report.json
          --output _build/text-spacing-validation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: text-spacing-evidence-php-${{ matrix.php }}
          path: _build/text-spacing-validation
          if-no-files-found: error
